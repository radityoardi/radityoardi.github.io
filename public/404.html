<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Found</title>
    <script>
      // GitHub Pages SPA fallback: load index.html and replace document
      (function() {
        var path = location.pathname;
        fetch('/index.html').then(function(r){
          return r.text();
        }).then(function(html){
          document.open();
          document.write(html);
          document.close();
          history.replaceState({}, '', path);
        }).catch(function(){
          // fallback: redirect to root
          location.replace('/');
        });
      })();
    </script>
  </head>
  <body></body>
</html>
