name: Build and deploy dist to PROD

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Prepare PROD branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/site-build
          cp -R dist /tmp/site-build/dist

          git stash push --include-untracked -m "temp before PROD publish" || true
          git fetch origin PROD || true

          if git ls-remote --exit-code --heads origin PROD >/dev/null 2>&1; then
            git checkout -B PROD origin/PROD
          else
            git checkout --orphan PROD
          fi

          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/site-build/dist/. .
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy built site"
          fi

      - name: Push dist to PROD
        run: git push origin HEAD:PROD --force
